<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite PWA Inspector</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/icon_light.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;400&family=Fira+Code&display=swap"
        rel="stylesheet"
    />
    <script>
      (function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        // check nuxt devtools color scheme switcher
        const setting = localStorage.getItem('nuxt-devtools-color-mode') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light')) {
          document.documentElement.classList.toggle('dark', true)
        }
      })();

      (function () {
        if (!location.pathname.endsWith('/'))
          location.pathname += '/'
      })();
    </script>
</head>
<body class="bg-main text-main font-sans">
<div id="vite-pwa-inspector"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
