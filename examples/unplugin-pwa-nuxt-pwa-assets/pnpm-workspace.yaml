includeWorkspaceRoot: false
ignoreDepScripts: true
ignoreWorkspaceRootCheck: false
autoInstallPeers: true
shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
trustPolicy: no-downgrade

allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  '@sveltejs/kit': true
  core-js: false
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

overrides:
  '@nuxt/kit': 4.5.1
  '@nuxt/nitro-server': 4.5.1
  '@nuxt/schema': 4.5.1
  '@nuxt/test-utils': 4.1.0
  '@nuxt/vite-builder': 4.5.1
  '@types/node': 24.12.0
  nuxt: 4.5.1
  chokidar: ^5.0.0
  devframe: ^0.7.5
  postcss-selector-parser: 7.1.4
  rolldown: 1.1.2
  sharp: 0.35.3
  semver: ^7.8.4
  vue: 3.5.40

minimumReleaseAgeExclude:
  - vite@8.1.0
  - '@nuxt/*'
  - nuxt

supportedArchitectures:
  os:
    - win32
    - darwin
    - current
  cpu:
    - x64
    - arm64
