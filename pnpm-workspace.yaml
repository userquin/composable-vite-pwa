autoInstallPeers: true

catalogMode: prefer

cleanupUnusedCatalogs: true

dedupePeers: true

ignoreDepScripts: true

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

verifyDepsBeforeRun: install

preferWorkspacePackages: true

shamefullyHoist: true

shellEmulator: true

strictPeerDependencies: false

trustPolicy: no-downgrade

packages:
  - examples/**
  - packages/astro/**
  - packages/unplugin-pwa/**
  - packages/workbox/**

overrides:
  chokidar: ^5.0.0
  postcss-selector-parser: 7.1.4
  rolldown: 1.1.2
  semver: ^7.8.4

patchedDependencies:
  dotenv-expand@13.0.0: patches/dotenv-expand@13.0.0.patch

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  sharp: true
  unrs-resolver: false
  vue-demi: false

catalogs:
  astro:
    astro: ^7.0.4
  #  astro5:
  #    astro: ^5.18.2
  #    eslint-plugin-astro: ^1.3.1
  #  astro6:
  #    astro: ^6.4.8
  #    eslint-plugin-astro: ^2.1.1
  build:
    tsdown: ^0.22.3
  docs:
    typedoc: ^0.28.19
  eslint:
    '@antfu/eslint-config': ^8.2.0
    eslint: ^10.2.1
    eslint-plugin-antfu: ^3.2.2
  nuxt4:
    nuxt: 4.4.8
    vue-router: 5.1.0
  preact:
    preact: ^10.29.0
  react:
    '@types/react': ^19.2.14
    react: ^19.2.4
  rsbuild:
    '@rsbuild/core': ^2.0.7
  rspack:
    '@rspack/core': ^2.0.4
  solid-js:
    solid-js: ^1.9.12
  svelte:
    svelte: ^5.55.0
  sveltekit2:
    '@sveltejs/adapter-node': ^5.5.7
    '@sveltejs/adapter-static': ^3.0.10
    '@sveltejs/kit': ^2.63.0
    '@sveltejs/vite-plugin-svelte': ^7.1.2
    svelte: ^5.56.1
    svelte-check: ^4.6.0
  test:
    '@vitest/ui': ^4.1.5
    vitest: ^4.1.5
  types:
    '@types/node': ^24.12.0
    '@types/semver': ^7.7.1
    '@types/serialize-javascript': ^5.0.4
    '@types/trusted-types': ^2.0.7
    '@types/webpack': ^5.28.1
  typescript:
    typescript: ~5.9.3
  utils:
    '@antfu/ni': ^25.0.0
    '@arethetypeswrong/cli': ^0.17.4
    '@clack/prompts': ^1.5.1
    '@vite-pwa/assets-generator': ^1.0.2
    ansis: ^4.2.0
    cac: ^7.0.0
    consola: ^3.4.2
    dotenv-expand: 13.0.0
    idb: ^8.0.3
    magic-string: ^0.30.21
    magicast: ^0.5.2
    picocolors: ^1.1.1
    proper-tags: ^2.0.2
    publint: ^0.3.18
    rolldown: ^1.1.2
    "@rolldown/pluginutils": ^1.0.1
    semver: ^7.8.4
    serialize-javascript: ^7.0.5
    std-env: ^4.1.0
    taze: ^19.10.0
    tinyglobby: ^0.2.16
    unplugin: ^3.0.0
    unplugin-utils: ^0.3.1
    valibot: ^1.3.1

  vite:
    vite: 8.1.0
  vite5:
    vite: 5.3.6
  # vite 8
  vite-plugin-inspect:
    '@vitejs/devtools': 0.3.3
    vite-plugin-inspect: 12.0.0-beta.3
  # vite 6/7
  #  vite-plugin-inspect-legacy:
  #    vite-plugin-inspect: 11.4.1
  # vite 5
  vite-plugin-inspect-ancient:
    vite-plugin-inspect: 0.7.42
  vitepress2:
    vitepress: ^2.0.0-alpha.17
  vue:
    '@vitejs/plugin-vue': ^6.0.7
    '@vue/tsconfig': ^0.9.1
    vue: ^3.5.38
    vue-tsc: ^3.3.5
  webpack5:
    webpack: 5.107.1

minimumReleaseAgeExclude:
  - vite@8.1.0
  - '@astrojs/compiler-binding-darwin-arm64@0.3.0'
  - '@astrojs/compiler-binding-darwin-x64@0.3.0'
  - '@astrojs/compiler-binding-linux-arm64-gnu@0.3.0'
  - '@astrojs/compiler-binding-linux-arm64-musl@0.3.0'
  - '@astrojs/compiler-binding-linux-x64-gnu@0.3.0'
  - '@astrojs/compiler-binding-linux-x64-musl@0.3.0'
  - '@astrojs/compiler-binding-wasm32-wasi@0.3.0'
  - '@astrojs/compiler-binding-win32-arm64-msvc@0.3.0'
  - '@astrojs/compiler-binding-win32-x64-msvc@0.3.0'
  - '@astrojs/compiler-binding@0.3.0'
  - '@astrojs/compiler-rs@0.3.0'
  - astro@7.0.4
