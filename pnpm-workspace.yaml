autoInstallPeers: true

catalogMode: prefer

cleanupUnusedCatalogs: true

ignoreDepScripts: true

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

preferWorkspacePackages: true

shamefullyHoist: true

shellEmulator: true

strictPeerDependencies: false

trustPolicy: no-downgrade

overrides:
  semver: ^7.7.4

packages:
  - examples/**
  - packages/core/**
  - packages/workbox/**

catalogs:
  babel:
    "@babel/core": ^7.29.0
    "@babel/plugin-transform-modules-amd": ^7.27.1
    "@babel/plugin-transform-dynamic-import": ^7.27.1
  build:
    tsdown: ^0.21.10
  eslint:
    '@antfu/eslint-config': ^8.2.0
    eslint: ^10.2.1
    eslint-plugin-antfu: ^3.2.2
  preact:
    preact: ^10.29.0
  react:
    '@types/react': ^19.2.14
    react: ^19.2.4
  solid-js:
    solid-js: ^1.9.12
  svelte:
    svelte: ^5.55.0
  test:
    '@vitest/ui': ^4.1.5
    vitest: ^4.1.5
  types:
    '@types/node': ^24.12.0
    '@types/serialize-javascript': ^5.0.4
    '@types/trusted-types': ^2.0.7
  typescript:
    typescript: ~5.9.3
  utils:
    '@antfu/ni': ^25.0.0
    '@arethetypeswrong/cli': ^0.17.4
    '@vite-pwa/assets-generator': ^1.0.2
    ansis: ^4.2.0
    cac: ^7.0.0
    consola: ^3.4.2
    idb: ^8.0.3
    magicast: ^0.5.2
    magic-string: ^0.30.21
    picocolors: ^1.1.1
    pkg-types: ^2.3.0
    proper-tags: ^2.0.2
    publint: ^0.3.18
    semver: ^7.7.4
    serialize-javascript: ^7.0.5
    taze: ^19.10.0
    tinyglobby: ^0.2.16
    valibot: ^1.3.1
  vite:
    vite: ^8.0.9
  vue:
    vue: ^3.5.31
