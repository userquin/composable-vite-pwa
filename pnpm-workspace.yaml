packages:
  - examples/**
  - packages/core/**
  - packages/workbox/**
autoInstallPeers: true

catalogMode: prefer

catalogs:
  build:
    tsdown: ^0.21.10
  eslint:
    '@antfu/eslint-config': ^8.2.0
    eslint: ^10.2.1
    eslint-plugin-antfu: ^3.2.2
  preact:
    preact: ^10.29.0
  react:
    '@types/react': ^19.2.14
    react: ^19.2.4
  rsbuild:
    '@rsbuild/core': ^2.0.7
  rspack:
    '@rspack/core': ^2.0.4
  solid-js:
    solid-js: ^1.9.12
  svelte:
    svelte: ^5.55.0
  test:
    '@vitest/ui': ^4.1.5
    vitest: ^4.1.5
  types:
    '@types/node': ^24.12.0
    '@types/semver': ^7.7.1
    '@types/serialize-javascript': ^5.0.4
    '@types/trusted-types': ^2.0.7
    '@types/webpack': ^5.28.1
  typescript:
    typescript: ~5.9.3
  utils:
    '@antfu/ni': ^25.0.0
    '@arethetypeswrong/cli': ^0.17.4
    '@vite-pwa/assets-generator': ^1.0.2
    '@clack/prompts': ^1.5.1
    ansis: ^4.2.0
    cac: ^7.0.0
    consola: ^3.4.2
    dotenv-expand: 13.0.0
    idb: ^8.0.3
    magic-string: ^0.30.21
    magicast: ^0.5.2
    picocolors: ^1.1.1
    proper-tags: ^2.0.2
    publint: ^0.3.18
    rolldown: ^1.0.1
    semver: ^7.7.4
    serialize-javascript: ^7.0.5
    taze: ^19.10.0
    tinyglobby: ^0.2.16
    valibot: ^1.3.1
  vite:
    vite: ^8.0.13
  vue:
    vue: ^3.5.31
  webpack5:
    webpack: 5.107.1

cleanupUnusedCatalogs: true

ignoreDepScripts: true

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

verifyDepsBeforeRun: install

overrides:
  rolldown: ^1.0.0

patchedDependencies:
  dotenv-expand@13.0.0: patches/dotenv-expand@13.0.0.patch

preferWorkspacePackages: true

shamefullyHoist: true

shellEmulator: true

strictPeerDependencies: false

trustPolicy: no-downgrade

allowBuilds:
  sharp: true
